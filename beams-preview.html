<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beams Background — Live Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0a;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    .back-nav {
      position: absolute;
      top: 24px;
      left: 24px;
      z-index: 100;
      background: rgba(20, 24, 30, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 122, 26, 0.35);
      border-radius: 9999px;
      padding: 8px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #f4f1ea;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .back-nav:hover {
      background: #ff7a1a;
      color: #12171d;
      border-color: #ff7a1a;
      transform: translateY(-1px);
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      filter: blur(15px);
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 10, 10, 0.2);
      backdrop-filter: blur(40px);
      pointer-events: none;
    }
    .content {
      position: relative;
      z-index: 10;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 20px;
      pointer-events: none;
    }
    h1 {
      font-size: clamp(3rem, 8vw, 6rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.05;
      background: linear-gradient(180deg, #ffffff 40%, rgba(255, 255, 255, 0.5) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
    }
    p {
      font-size: clamp(1rem, 2.5vw, 1.5rem);
      color: rgba(255, 255, 255, 0.65);
      letter-spacing: -0.02em;
      max-width: 600px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 122, 26, 0.12);
      border: 1px solid rgba(255, 122, 26, 0.35);
      color: #ff7a1a;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 24px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <a href="index.html" class="back-nav">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
    Return to RigWise
  </a>

  <canvas id="beams-canvas"></canvas>
  <div class="overlay"></div>

  <div class="content">
    <div class="badge">Procedural Motion Canvas</div>
    <h1>Beams Background</h1>
    <p>Ultra-smooth dynamic lighting shader for futuristic PC build setups and hero sections.</p>
  </div>

  <script>
    const canvas = document.getElementById('beams-canvas');
    const ctx = canvas.getContext('2d');
    const MINIMUM_BEAMS = 20;
    let beams = [];
    let animId;

    function createBeam(width, height) {
      return {
        x: Math.random() * width * 1.5 - width * 0.25,
        y: Math.random() * height * 1.5 - height * 0.25,
        width: 30 + Math.random() * 60,
        length: height * 2.5,
        angle: -35 + Math.random() * 10,
        speed: 0.6 + Math.random() * 1.2,
        opacity: 0.15 + Math.random() * 0.18,
        hue: 20 + Math.random() * 40, // Warm amber / cyan glow
        pulse: Math.random() * Math.PI * 2,
        pulseSpeed: 0.02 + Math.random() * 0.03
      };
    }

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      ctx.scale(dpr, dpr);
      const totalBeams = Math.floor(MINIMUM_BEAMS * 1.5);
      beams = Array.from({ length: totalBeams }, () => createBeam(window.innerWidth, window.innerHeight));
    }

    function resetBeam(beam, index, total) {
      const col = index % 3;
      const sp = window.innerWidth / 3;
      beam.y = window.innerHeight + 100;
      beam.x = col * sp + sp / 2 + (Math.random() - 0.5) * sp * 0.5;
      beam.width = 100 + Math.random() * 100;
      beam.speed = 0.5 + Math.random() * 0.4;
      beam.hue = 20 + (index * 40) / total;
      beam.opacity = 0.2 + Math.random() * 0.1;
      return beam;
    }

    function drawBeam(b) {
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate((b.angle * Math.PI) / 180);
      const pulsingOpacity = b.opacity * (0.8 + Math.sin(b.pulse) * 0.2);
      const grad = ctx.createLinearGradient(0, 0, 0, b.length);
      grad.addColorStop(0, `hsla(${b.hue}, 95%, 65%, 0)`);
      grad.addColorStop(0.1, `hsla(${b.hue}, 95%, 65%, ${pulsingOpacity * 0.5})`);
      grad.addColorStop(0.4, `hsla(${b.hue}, 95%, 65%, ${pulsingOpacity})`);
      grad.addColorStop(0.6, `hsla(${b.hue}, 95%, 65%, ${pulsingOpacity})`);
      grad.addColorStop(0.9, `hsla(${b.hue}, 95%, 65%, ${pulsingOpacity * 0.5})`);
      grad.addColorStop(1, `hsla(${b.hue}, 95%, 65%, 0)`);
      ctx.fillStyle = grad;
      ctx.fillRect(-b.width / 2, 0, b.width, b.length);
      ctx.restore();
    }

    function animate() {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      ctx.filter = 'blur(35px)';
      beams.forEach((b, i) => {
        b.y -= b.speed;
        b.pulse += b.pulseSpeed;
        if (b.y + b.length < -100) resetBeam(b, i, beams.length);
        drawBeam(b);
      });
      animId = requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resize);
    resize();
    animate();
  </script>
</body>
</html>
